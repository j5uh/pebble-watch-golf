<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pebble Golf courses</title>
<style>body{font:16px system-ui,sans-serif;max-width:620px;margin:24px auto;padding:0 16px;color:#183d31}input[type=search]{box-sizing:border-box;width:100%;padding:12px;font:inherit}article{padding:16px 0;border-bottom:1px solid #ddd}small{display:block;margin:6px 0;color:#555}button{padding:9px 14px;margin:6px;font:inherit}label{display:inline-block;padding:8px}#done{position:sticky;bottom:8px;background:#183d31;color:white;border:0;border-radius:6px}#limit{color:#854719}</style></head>
<body><h1>Find and save courses</h1><p>Saving continues on your phone; reopen this page to confirm.</p><input id="search" type="search" placeholder="Course name or city" aria-label="Search courses"><p id="limit"></p><div id="rows">Loading courses…</div><button id="done">Done</button>
<script>
(function() {
  var state={saved:{},failed:[]}, catalog=[], saves={}, removes={};
  try {state=JSON.parse(decodeURIComponent(location.hash.slice(1)));} catch (e) {}
  state.saved=state.saved || {}; state.failed=state.failed || [];
  var rows=document.getElementById('rows'), search=document.getElementById('search');
  function count() {
    var ids={};
    Object.keys(state.saved).forEach(function(id) {if (id!==state.builtIn && !removes[id]) ids[id]=true;});
    Object.keys(saves).forEach(function(id) {if (saves[id]) ids[id]=true;});
    return Object.keys(ids).length;
  }
  function render() {
    rows.textContent='';
    var full=count()>=6, query=search.value.toLowerCase();
    document.getElementById('limit').textContent=full?'Remove one to save another (6 max)':'';
    catalog.forEach(function(c) {
      if ((c.name+' '+(c.short || '')+' '+(c.city || '')).toLowerCase().indexOf(query)<0) return;
      var row=document.createElement('article'), name=document.createElement('strong'), status=document.createElement('small');
      name.textContent=c.name; row.appendChild(name);
      var saved=state.saved[c.id] && !removes[c.id], builtin=c.id===state.builtIn;
      status.textContent=(c.city?c.city+' · ':'')+(builtin?'Built in':state.failed.indexOf(c.id)>=0?'Last save failed':saved?(c.version && state.saved[c.id]!==c.version?'Update available':'Saved'):'Not saved');
      row.appendChild(status);
      if (!builtin) {
        var label=document.createElement('label'), check=document.createElement('input');
        check.type='checkbox'; check.checked=!!saves[c.id]; check.disabled=full && !saved && !saves[c.id];
        check.onchange=function() {saves[c.id]=check.checked; if (check.checked) delete removes[c.id]; render();};
        label.appendChild(check); label.appendChild(document.createTextNode(' Save')); row.appendChild(label);
        if (saved && c.id!==state.current) {
          var button=document.createElement('button'); button.textContent='Remove';
          button.onclick=function() {removes[c.id]=true; delete saves[c.id]; render();}; row.appendChild(button);
        }
      }
      rows.appendChild(row);
    });
  }
  search.oninput=render;
  document.getElementById('done').onclick=function() {
    location.href='pebblejs://close#'+encodeURIComponent(JSON.stringify({save:Object.keys(saves).filter(function(id) {return saves[id];}),remove:Object.keys(removes)}));
  };
  var xhr=new XMLHttpRequest(); xhr.open('GET','index.json'); xhr.timeout=15000;
  xhr.onload=function() {try {if (xhr.status!==200) throw new Error(); catalog=JSON.parse(xhr.responseText); render();} catch (e) {rows.textContent='Could not load courses. Reopen this page to retry.';}};
  xhr.onerror=xhr.ontimeout=function() {rows.textContent='Could not load courses. Reopen this page to retry.';}; xhr.send();
}());
</script></body></html>
